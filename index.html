<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五子棋</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #eee;
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 12px;
    letter-spacing: 6px;
    color: #e2b96f;
    text-shadow: 0 0 20px rgba(226,185,111,0.4);
  }
  #status {
    font-size: 1.1rem;
    margin-bottom: 14px;
    height: 28px;
    color: #ccc;
  }
  #status .highlight { color: #e2b96f; font-weight: bold; }
  #board-wrap {
    position: relative;
    background: #c8a96e;
    border-radius: 8px;
    padding: 24px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  canvas { display: block; cursor: crosshair; border-radius: 4px; }
  #controls {
    margin-top: 16px;
    display: flex;
    gap: 12px;
  }
  button {
    padding: 8px 24px;
    border: none;
    border-radius: 6px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  #btn-restart {
    background: #e2b96f;
    color: #1a1a2e;
    font-weight: bold;
  }
  #btn-restart:hover { background: #f0cc88; transform: translateY(-1px); }
  #btn-undo {
    background: #3a3a5c;
    color: #ccc;
    border: 1px solid #555;
  }
  #btn-undo:hover { background: #4a4a6c; transform: translateY(-1px); }
  #score {
    display: flex;
    gap: 32px;
    margin-bottom: 14px;
    font-size: 0.95rem;
  }
  .score-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stone-icon {
    width: 18px; height: 18px;
    border-radius: 50%;
    display: inline-block;
  }
  .black-icon { background: radial-gradient(circle at 35% 35%, #666, #000); }
  .white-icon { background: radial-gradient(circle at 35% 35%, #fff, #aaa); border: 1px solid #999; }
</style>
</head>
<body>
<h1>五 子 棋</h1>
<div id="score">
  <div class="score-item">
    <span class="stone-icon black-icon"></span>
    <span>黑棋：<strong id="score-black">0</strong> 胜</span>
  </div>
  <div class="score-item">
    <span class="stone-icon white-icon"></span>
    <span>白棋：<strong id="score-white">0</strong> 胜</span>
  </div>
</div>
<div id="status"><span class="highlight">黑棋</span> 先行</div>
<div id="board-wrap">
  <canvas id="board" width="480" height="480"></canvas>
</div>
<div id="controls">
  <button id="btn-undo">↩ 悔棋</button>
  <button id="btn-restart">🔄 重新开始</button>
</div>

<script>
const SIZE = 15;
const CELL = 30;
const PAD = 15;
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const scoreBlack = document.getElementById('score-black');
const scoreWhite = document.getElementById('score-white');

let board, current, history, gameOver, scores;

function init() {
  board = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  current = 1; // 1=black, 2=white
  history = [];
  gameOver = false;
  if (!scores) scores = {1: 0, 2: 0};
  updateStatus();
  draw();
}

function updateStatus(winner) {
  if (winner) {
    const name = winner === 1 ? '<span class="highlight">黑棋</span>' : '<span class="highlight">白棋</span>';
    statusEl.innerHTML = `🎉 ${name} 获胜！`;
  } else if (gameOver) {
    statusEl.innerHTML = '平局！棋盘已满';
  } else {
    const name = current === 1 ? '<span class="highlight">黑棋</span>' : '<span class="highlight">白棋</span>';
    statusEl.innerHTML = `${name} 落子`;
  }
  scoreBlack.textContent = scores[1];
  scoreWhite.textContent = scores[2];
}

function pos(i) { return PAD + i * CELL; }

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = '#8b6914';
  ctx.lineWidth = 1;
  for (let i = 0; i < SIZE; i++) {
    ctx.beginPath(); ctx.moveTo(pos(i), pos(0)); ctx.lineTo(pos(i), pos(SIZE-1)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pos(0), pos(i)); ctx.lineTo(pos(SIZE-1), pos(i)); ctx.stroke();
  }

  // Star points
  ctx.fillStyle = '#8b6914';
  const stars = [[3,3],[3,11],[11,3],[11,11],[7,7]];
  stars.forEach(([r,c]) => {
    ctx.beginPath(); ctx.arc(pos(c), pos(r), 3, 0, Math.PI*2); ctx.fill();
  });

  // Stones
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c]) drawStone(r, c, board[r][c]);
    }
  }

  // Last move marker
  if (history.length > 0) {
    const last = history[history.length - 1];
    ctx.strokeStyle = last.player === 1 ? '#fff' : '#333';
    ctx.lineWidth = 1.5;
    const x = pos(last.c), y = pos(last.r), s = 5;
    ctx.beginPath();
    ctx.moveTo(x-s, y); ctx.lineTo(x+s, y);
    ctx.moveTo(x, y-s); ctx.lineTo(x, y+s);
    ctx.stroke();
  }
}

function drawStone(r, c, player) {
  const x = pos(c), y = pos(r), radius = CELL/2 - 2;
  const grad = ctx.createRadialGradient(x-3, y-3, 1, x, y, radius);
  if (player === 1) {
    grad.addColorStop(0, '#888'); grad.addColorStop(1, '#111');
  } else {
    grad.addColorStop(0, '#fff'); grad.addColorStop(1, '#bbb');
  }
  ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI*2);
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = player === 1 ? '#333' : '#888';
  ctx.lineWidth = 0.5; ctx.stroke();
}

function checkWin(r, c, player) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    let count = 1;
    for (let d = 1; d < 5; d++) {
      const nr = r+dr*d, nc = c+dc*d;
      if (nr<0||nr>=SIZE||nc<0||nc>=SIZE||board[nr][nc]!==player) break;
      count++;
    }
    for (let d = 1; d < 5; d++) {
      const nr = r-dr*d, nc = c-dc*d;
      if (nr<0||nr>=SIZE||nc<0||nc>=SIZE||board[nr][nc]!==player) break;
      count++;
    }
    if (count >= 5) return true;
  }
  return false;
}

canvas.addEventListener('click', e => {
  if (gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;
  const c = Math.round((mx - PAD) / CELL);
  const r = Math.round((my - PAD) / CELL);
  if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return;
  if (board[r][c] !== 0) return;

  board[r][c] = current;
  history.push({r, c, player: current});
  draw();

  if (checkWin(r, c, current)) {
    gameOver = true;
    scores[current]++;
    updateStatus(current);
    highlightWin(r, c, current);
    return;
  }

  if (history.length === SIZE * SIZE) {
    gameOver = true;
    updateStatus();
    return;
  }

  current = current === 1 ? 2 : 1;
  updateStatus();
});

function highlightWin(r, c, player) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    let cells = [[r, c]];
    for (let d = 1; d < 5; d++) {
      const nr = r+dr*d, nc = c+dc*d;
      if (nr<0||nr>=SIZE||nc<0||nc>=SIZE||board[nr][nc]!==player) break;
      cells.push([nr, nc]);
    }
    for (let d = 1; d < 5; d++) {
      const nr = r-dr*d, nc = c-dc*d;
      if (nr<0||nr>=SIZE||nc<0||nc>=SIZE||board[nr][nc]!==player) break;
      cells.push([nr, nc]);
    }
    if (cells.length >= 5) {
      ctx.strokeStyle = '#ff4444';
      ctx.lineWidth = 3;
      cells.forEach(([cr, cc]) => {
        ctx.beginPath();
        ctx.arc(pos(cc), pos(cr), CELL/2-2, 0, Math.PI*2);
        ctx.stroke();
      });
      return;
    }
  }
}

document.getElementById('btn-restart').onclick = init;
document.getElementById('btn-undo').onclick = () => {
  if (gameOver || history.length === 0) return;
  const last = history.pop();
  board[last.r][last.c] = 0;
  current = last.player;
  updateStatus();
  draw();
};

// Hover effect
canvas.addEventListener('mousemove', e => {
  if (gameOver) return;
  draw();
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;
  const c = Math.round((mx - PAD) / CELL);
  const r = Math.round((my - PAD) / CELL);
  if (r < 0 || r >= SIZE || c < 0 || c >= SIZE || board[r][c] !== 0) return;
  const x = pos(c), y = pos(r), radius = CELL/2 - 2;
  ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI*2);
  ctx.fillStyle = current === 1 ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.4)';
  ctx.fill();
});

canvas.addEventListener('mouseleave', () => { if (!gameOver) draw(); });

init();
</script>
</body>
</html>
